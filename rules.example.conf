# Example Aduana rules file (pure allowlist: default-deny).
# Any traffic that does not match an `allow` is blocked by default.

# --- Clients ---
# They can be declared by exact IP (IPv4/IPv6) or CIDR subnet (no overlaps).
client web-01 10.0.10.21
client worker-pool 10.0.20.0/24

# --- Rules ---
# They are evaluated in order; the first matching rule wins.

# Example with secret injection and body logging
rule stripe {
  from  web-01
  to    api.stripe.com
  allow POST /v1/charges
  allow GET /v1/customers/**
  set header authorization "Bearer ${secret.stripe_key}"
  set header x-aduana-client "${client.name}"
  remove header x-debug
  log body
}

# Example with read access from any declared client and conditional token replacement
# (`replace header` only injects the PAT if the client already sends an `Authorization` header)
rule github-readonly {
  from  *
  to    api.github.com
  allow GET,HEAD /repos/*/*
  allow GET /repos/*/*/releases/**
  replace header authorization "Bearer ${secret.github_pat}"
}

# Example with a wildcard subdomain and several clients
rule assets-s3 {
  from  web-01, worker-pool
  to    *.s3.amazonaws.com
  allow GET,HEAD /public/**
}

# Example with an explicit HTTP scheme and a non-standard port
rule legacy-webhook {
  from  worker-pool
  to    http://hooks.example.org:8080
  allow POST /notify/*
}
